<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 5: Віджет погоди</title>
    <link rel="stylesheet" href="CSS/style5.css">
</head>
<body>

<div class="widget-wrapper">
    <div class="weather-main">
        <div class="nav-arrows">
            <button type="button" class="nav-arrow-btn">
                <img src="img/arrow_back.svg" alt="Назад" class="nav-arrow">
            </button>
            <button type="button" class="nav-arrow-btn">
                <img src="img/arrow_forward.svg" alt="Вперед" class="nav-arrow">
            </button>
        </div>

        <div class="temperature-current">
            17
        </div>
    </div>

    <img src="img/cloud.png" alt="Хмара" class="weather-cloud">

    <div class="weather-forecast">
        <div class="day">
            <span>Mon</span>
            <strong>17°</strong>
        </div>
        <div class="day">
            <span>Tue</span>
            <strong>19°</strong>
        </div>
        <div class="day">
            <span>Wed</span>
            <strong>16°</strong>
        </div>
        <div class="day">
            <span>Thu</span>
            <strong>18°</strong>
        </div>
        <div class="day">
            <span>Fri</span>
            <strong>21°</strong>
        </div>
    </div>

</div>

</body>
</html>
